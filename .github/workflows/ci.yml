name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./kanban-project
        run: |
          npm ci

      - name: Install Playwright browsers
        working-directory: ./kanban-project
        run: |
          npx playwright install --with-deps

      - name: Run CSS linter
        working-directory: ./kanban-project
        run: |
          npm run lint:css

      - name: Run Playwright interaction test
        working-directory: ./kanban-project
        env:
          # Ensure headful is disabled in CI
          HEADFUL: ''
        run: |
          npm run ci:test
